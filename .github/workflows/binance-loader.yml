name: Binance  Supabase Loader

on:
  schedule:
    - cron: "*/200 * * * *"   # every 15 minutes
  workflow_dispatch: {}

jobs:
  recent-hour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas psycopg2-binary

      - name: Run loader (RECENT_1H)
        env:
          PG_DSN: ${{ secrets.PG_DSN_CRYPTO }}        # <-- DSN from secrets, interval 2h, mode FULL
        run: |
          python binance_parser.py \
            --symbols "BTC,SOL,ETH,ARB,XRP,BNB,ADA,DOGE,UNI" \
            --interval 1h \ 
            --mode FULL \
