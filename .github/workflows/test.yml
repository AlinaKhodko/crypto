name: Test Every 5 Minutes

on:
  schedule:
    - cron: "*/1 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch: {}      # allow manual run too

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print timestamp
        run: |
          echo "Workflow triggered!"
          date -u +"UTC time: %Y-%m-%d %H:%M:%S"
