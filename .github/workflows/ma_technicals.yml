name: Binance + MA Technicals

on:
  schedule:
    # GitHub cron uses UTC. "*/60 * * * *" = hourly at minute 0.
    - cron: "*/60 * * * *"
  workflow_dispatch: {}

# Prevent overlapping runs of this workflow
concurrency:
  group: crypto-pipelines
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recent-hour:
    name: Run Binance Loader (RECENT_1H)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas psycopg2-binary

      - name: Run loader
        env:
          PG_DSN: ${{ secrets.PG_DSN_CRYPTO }}   # <-- DSN from secrets
        run: |
          python binance_parser.py \
            --symbols "BTC,ARB,ETH,SOL" \
            --interval 1h \
            --mode RECENT_1H

  calc:
    name: Run MA Technicals
    runs-on: ubuntu-latest
    needs: recent-hour     # wait for loader to finish; remove if parallel is fine
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run calculation job
        env:
          PG_DSN: ${{ secrets.PG_DSN_CRYPTO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.run_signals
